<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SejaAna — Transforme sua selfie</title>
<style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(150deg,#f6a4cf,#ffe3f1 65%,#fff);font-family:system-ui,-apple-system,sans-serif;color:#5e1640;min-height:100vh}main{max-width:570px;margin:auto;padding:35px 18px;text-align:center}h1{font-size:clamp(55px,13vw,84px);letter-spacing:-4px;color:#bd1267;margin:8px 0;text-shadow:3px 4px white}.panel{background:#ffffffdd;border-radius:25px;padding:20px;box-shadow:0 12px 35px #8f13522b}canvas{display:none;width:100%;height:auto;border-radius:15px;background:#f6d8e7}button,.upload{display:block;width:100%;border:0;border-radius:14px;padding:16px;font-weight:800;font-size:17px;background:#bf1469;color:#fff;margin:12px 0;cursor:pointer}.upload{background:white;color:#bf1469;border:2px dashed #bf1469}input{display:none}button:disabled{opacity:.45}#status{min-height:26px;font-weight:600}small{color:#82536b}
</style><script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script></head>
<body><main><h1>SejaAna</h1><p>A maquiagem icônica, agora no seu rosto!</p><section class="panel">
<label for="photo" class="upload">Escolher minha selfie</label><input id="photo" type="file" accept="image/*">
<canvas id="canvas"></canvas><p id="status">Escolha uma foto de rosto de frente.</p>
<button id="apply" disabled>Aplicar maquiagem</button><button id="save" disabled>Baixar PNG</button>
<small>Processamento local no navegador. Sua selfie não é enviada a um servidor.</small></section></main>
<script>
const photo=document.querySelector('#photo'),canvas=document.querySelector('#canvas'),ctx=canvas.getContext('2d'),status=document.querySelector('#status'),apply=document.querySelector('#apply'),save=document.querySelector('#save');
let img=null,mesh=null;
photo.onchange=async()=>{const f=photo.files[0];if(!f)return;img=new Image();img.onload=()=>{const s=Math.min(1,1200/Math.max(img.width,img.height));canvas.width=Math.round(img.width*s);canvas.height=Math.round(img.height*s);ctx.drawImage(img,0,0,canvas.width,canvas.height);canvas.style.display='block';apply.disabled=false;save.disabled=true;status.textContent='Foto pronta! Toque em Aplicar maquiagem.'};img.src=URL.createObjectURL(f)};
const P=(lm,i)=>({x:lm[i].x*canvas.width,y:lm[i].y*canvas.height});
function shape(lm,ids,color,alpha=1){ctx.save();ctx.globalAlpha=alpha;ctx.fillStyle=color;ctx.beginPath();ids.forEach((i,n)=>{const p=P(lm,i);n?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y)});ctx.closePath();ctx.fill();ctx.restore()}
function stroke(lm,ids,color,w){ctx.save();ctx.strokeStyle=color;ctx.lineWidth=w;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ids.forEach((i,n)=>{const p=P(lm,i);n?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y)});ctx.stroke();ctx.restore()}
function makeup(lm){const left=P(lm,33),right=P(lm,263),scale=Math.hypot(right.x-left.x,right.y-left.y),w=Math.max(2,scale*.018);
shape(lm,[70,63,105,66,107,55,65,52,53,46],'#fff5ec',.65);
shape(lm,[300,293,334,296,336,285,295,282,283,276],'#fff5ec',.65);
shape(lm,[33,160,158,133,153,144],'#fff',.85);shape(lm,[263,387,385,362,380,373],'#fff',.85);
stroke(lm,[33,160,158,133],'#181017',w*1.7);stroke(lm,[263,387,385,362],'#181017',w*1.7);
stroke(lm,[70,63,105,66,107],'#33202c',w*2.1);stroke(lm,[300,293,334,296,336],'#33202c',w*2.1);
for(const side of [[70,105,107,55],[300,334,336,285]]){const a=P(lm,side[0]),b=P(lm,side[2]);ctx.save();ctx.strokeStyle='#3e2932';ctx.lineWidth=w*1.65;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(a.x,a.y-scale*.40);ctx.bezierCurveTo(a.x-scale*.04,a.y-scale*.85,b.x,b.y-scale*.8,b.x,b.y);ctx.stroke();ctx.restore()}
shape(lm,[61,40,37,0,267,270,291,321,314,17,84,91],'#60102f',.94);
shape(lm,[61,185,40,37,0,267,270,409,291,375,321,314,17,84,91,146],'#8a1744',.82);
stroke(lm,[61,40,37,0,267,270,291,321,314,17,84,91,61],'#390b24',w*1.3);
shape(lm,[50,101,118,119,100,126],'#e06499',.20);shape(lm,[280,330,347,348,329,355],'#e06499',.20);
}
apply.onclick=async()=>{if(!img)return;apply.disabled=true;status.textContent='Reconhecendo seu rosto...';try{if(!window.FaceMesh)throw Error('Biblioteca de reconhecimento não carregou.');if(!mesh){mesh=new FaceMesh({locateFile:f=>'https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/'+f});mesh.setOptions({maxNumFaces:1,refineLandmarks:true,minDetectionConfidence:.5})}const lm=await new Promise(async(resolve,reject)=>{const t=setTimeout(()=>reject(Error('Tempo esgotado')),20000);mesh.onResults(r=>{clearTimeout(t);resolve(r.multiFaceLandmarks?.[0])});try{await mesh.send({image:canvas})}catch(e){clearTimeout(t);reject(e)}});if(!lm)throw Error('Não encontrei um rosto. Use uma selfie de frente e bem iluminada.');ctx.drawImage(img,0,0,canvas.width,canvas.height);makeup(lm);save.disabled=false;status.textContent='Pronto! Sua versão SejaAna está disponível.'}catch(e){status.textContent='Erro: '+e.message}finally{apply.disabled=false}};
save.onclick=()=>{const a=document.createElement('a');a.href=canvas.toDataURL('image/png');a.download='SejaAna.png';a.click()};
</script></body></html>
